---
# vps_runner managed inventory — dev environment
#
# This file is the SSOT for which VPS nodes vps_runner manages in dev.
# All node-level metadata lives in host_vars/<alias>.yml.
#
# Groups:
#   vps_targets     all dev VPS managed by vps_runner
#   vps_status_*    optional grouping by lifecycle status (filled by host_vars)
#
# Add a node: vps-runner onboard <alias> --env dev ... (CLI manages this file)
# Manual edit: only when migrating or recovering from inventory corruption.

all:
  children:
    vps_targets:
      hosts:
        hy-hk-u24:
        hk-d13:
        hk-d12:
        hk-u24:
