# vault.example.yml — shape of the vault variables (no real secrets; safe to commit)
#
# This file lives under inventory/examples/ — Ansible does NOT auto-load it.
# (Compare: any *.yml under inventory/<env>/group_vars/<g>/ IS auto-loaded.)
#
# Workflow:
#   1. cp inventory/examples/group_vars/all/vault.example.yml \
#        inventory/<env>/group_vars/all/vault.yml
#   2. Edit the new vault.yml and fill in the real passwords
#   3. ansible-vault encrypt inventory/<env>/group_vars/all/vault.yml
#   4. Commit the encrypted vault.yml (never commit the plain-text version)
#
# Reference from vars.yml (naming convention: vault_ prefix marks the source):
#   db_root_password: "{{ vault_db_root_password }}"

---
vault_db_root_password: "REPLACE_WITH_REAL_PASSWORD"
vault_db_app_password: "REPLACE_WITH_REAL_PASSWORD"
vault_api_secret_key: "REPLACE_WITH_32_CHAR_RANDOM_STRING"
vault_smtp_password: "REPLACE_WITH_REAL_PASSWORD"
vault_grafana_admin_password: "REPLACE_WITH_REAL_PASSWORD"
