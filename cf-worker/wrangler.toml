name = "ansispire-vps-worker"
main = "src/index.js"
compatibility_date = "2026-06-06"

[vars]
SEMAPHORE_URL = "https://semaphore.example.invalid"
SEMAPHORE_PROJECT_ID = "1"
SEMAPHORE_INVENTORY_ID = "3"
SEMAPHORE_ONBOARD_TEMPLATE_ID = ""
SEMAPHORE_AUDIT_TEMPLATE_ID = ""

# Set with:
#   npx wrangler secret put SEMAPHORE_API_TOKEN
#   npx wrangler secret put WORKER_AUTH_USER
#   npx wrangler secret put WORKER_AUTH_PASSWORD
#
# For live probe deploys, override the non-secret vars explicitly, e.g.:
#   npx wrangler deploy --var SEMAPHORE_URL:https://semaphore.saberu.com --var SEMAPHORE_INVENTORY_ID:3
