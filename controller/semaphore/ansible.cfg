# Ansible config for the Semaphore CONTAINER execution context ONLY.
# Selected via ANSIBLE_CONFIG in controller/semaphore/docker-compose.yml
# (the semaphore service env). CWD at runtime is /workspace, so the relative
# role/plugin/collection paths below resolve identically to the repo-root
# ansible.cfg.
#
# Sole intentional divergence from the repo-root ansible.cfg:
#   - NO vault_password_file
#   - NO default inventory (Semaphore always passes -i its own fleet inventory)
#
# Rationale: the Semaphore / VPS onboard+audit path is vault-free BY DESIGN
# (D3=b placeholder — Semaphore never holds the vault password; onboard.yml /
# audit.yml + their roles reference zero vault_* vars; prod inventory is
# plaintext; real creds come from the Semaphore Key Store). The repo-root
# ansible.cfg's global `vault_password_file = .vault_pass` would force every
# in-container run to eager-load the host .vault_pass (uid 1000, mode 600),
# which the container process (uid 1001) cannot read — see docs GOTCHA 1.
# This profile removes that unnecessary demand instead of feeding it a fake
# password. Vault stays fully in force for hub-deploy / dev / db / local paths
# via the repo-root config.
[defaults]
# Role search path
roles_path = roles:~/.ansible/roles

# Collection search path (Writable-First for Containers)
collections_path = ~/.ansible/collections:collections

# Plugin paths
filter_plugins = filter_plugins
lookup_plugins = lookup_plugins
callback_plugins = callback_plugins

# Output formatting
stdout_callback = default
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
