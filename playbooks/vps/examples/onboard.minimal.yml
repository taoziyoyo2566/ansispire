# yaml-language-server: $schema=vps_task.schema.json
---
vps_task:
  bootstrap:
    host: 203.0.113.10
    port: 22
    user: root
    auth:
      method: password
      password_env: VPS_JP_TOKYO_01_AUTH  # pragma: allowlist secret
  managed:
    user: ansible
    groups:
      - sudo
      - ssh-users
    authorized_keys:
      # Inline content is the Semaphore-container contract (no host file needed).
      # The file-path form `- public_key: ~/.ssh/foo.pub` still works for local runs.
      - public_key_content: "ssh-ed25519 REPLACE-WITH-FLEET-PUBLIC-KEY ansible@ansispire"
    sudo:
      nopasswd: true
  ssh:
    managed_port: 39222
    disable_root_login: true
    disable_password_login: true
    disable_kbd_interactive: true
    allow_groups:
      - ssh-users
    close_bootstrap_port_after_success: true
  profile:
    base_packages: true
    unattended_upgrades: true
    system_limits: true
  firewall:
    allowed_tcp_ports:
      - 39222
  fail2ban:
    enabled: true
