---
# vps_runner remove playbook.
#
# Defaults to a no-op on the remote side — the CLI handles inventory deletion
# (host_vars/<alias>.yml + entry in hosts.yml) locally after this run succeeds.
#
# When the CLI passes `vps_cleanup_remote=true` (e.g. via `--cleanup-remote`),
# this strips the Ansispire-managed sshd drop-ins so the host returns to the
# distro-default sshd state. UFW rules and the managed user are intentionally
# left alone (manual cleanup; safer default for "I am taking this VPS back").

- name: Remote cleanup for VPS removal (vps_runner)
  hosts: vps_targets
  become: true
  gather_facts: false
  vars:
    vps_cleanup_remote: "{{ vps_cleanup_remote | default(false) | bool }}"

  pre_tasks:
    - name: Collect service facts (for SSH service name resolution)
      ansible.builtin.service_facts:
      check_mode: false
      when: vps_cleanup_remote

    - name: Resolve SSH service name
      ansible.builtin.set_fact:
        vps_ssh_service_name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"
      when: vps_cleanup_remote

  tasks:
    - name: Remove Ansispire managed sshd drop-in (when requested)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/ssh/sshd_config.d/00-ansispire.conf
        - /etc/ssh/sshd_config.d/99-ansispire.conf
      when: vps_cleanup_remote
      notify: Reload sshd

    - name: Restore Ansispire-commented directives in main sshd_config
      # Reverses the sentinel `# ANSISPIRE-COMMENTED: <directive> <value>` lines
      # written by onboard.yml back to plain `<directive> <value>` so the host
      # returns to its pre-onboard sshd state. Caveat: hosts onboarded BEFORE
      # Round 5 used a different marker (`# <dir> managed by ...`) and require
      # manual restoration.
      ansible.builtin.replace:
        path: /etc/ssh/sshd_config
        regexp: '^#\s*ANSISPIRE-COMMENTED:\s*(.*)$'
        replace: '\1'
        backup: true
      when: vps_cleanup_remote
      notify: Reload sshd

    - name: Validate sshd after optional cleanup
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false
      check_mode: false
      when: vps_cleanup_remote

    - name: Flush handlers — apply sshd cleanup now
      ansible.builtin.meta: flush_handlers
      when: vps_cleanup_remote

    - name: Report no-op when remote cleanup not requested
      ansible.builtin.debug:
        msg: >-
          Remote cleanup skipped; local inventory entry will still be removed.
          Pass --cleanup-remote to strip Ansispire sshd drop-ins.
      when: not vps_cleanup_remote

  handlers:
    - name: Reload sshd
      ansible.builtin.systemd:
        name: "{{ vps_ssh_service_name }}"
        state: reloaded
      when: not ansible_check_mode
