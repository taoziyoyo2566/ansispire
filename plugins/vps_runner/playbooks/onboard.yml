---
# vps_runner onboard playbook.
#
# Reads from standard inventory:
#   - top-level: ansible_host / ansible_port / ansible_user / security / features /
#                firewall / fail2ban / network_tuning / swap / packages / docker
#   - vps_runner.*: bootstrap_port / bootstrap_user / managed_port / managed_user /
#                   identity_file / ansible_public_key / personal_keys / ...
#
# Precondition: target VPS already has python3 (plan §6 D8 - no raw bootstrap).
# Re-onboard is idempotent. For first-time onboard from a different user/port,
# the CLI passes vps_first_time_* marker vars; this play switches connection
# facts before explicit fact gathering so host_vars stay canonical.

- name: Onboard VPS into Ansispire management (vps_runner)
  hosts: vps_targets
  become: true
  gather_facts: false
  vars:
    # Combine group-wide vps_runner_defaults with per-host vps_runner.
    # See group_vars/vps_targets.yml for the split rationale.
    vr: "{{ (vps_runner_defaults | default({})) | combine(vps_runner | default({})) }}"
    vps_bootstrap:
      port: "{{ vr.bootstrap_port | default(22) }}"
    vps_managed:
      user: "{{ vr.managed_user | default('ansible') }}"
      groups: "{{ vr.managed_groups | default(['sudo']) }}"
      shell: "{{ vr.managed_shell | default('/bin/bash') }}"
      authorized_keys: >-
        {{
          ([{'name': 'ansispire_runner', 'public_key': vr.ansible_public_key}]
           + (vr.personal_keys | default([])))
          | selectattr('public_key', 'defined')
          | rejectattr('public_key', 'equalto', None)
          | list
        }}
      sudo:
        nopasswd: "{{ vr.sudo_nopasswd | default(true) }}"
      ansible_key:
        private_key: "{{ vr.identity_file }}"
    vps_ssh:
      managed_port: "{{ vr.managed_port | default(ansible_port) }}"
      disable_root_login: "{{ (security | default({})).root_login_disabled | default(true) }}"
      disable_password_login: "{{ (security | default({})).password_login_disabled | default(true) }}"
      disable_kbd_interactive: "{{ (security | default({})).disable_kbd_interactive | default(true) }}"
      allow_groups: "{{ (security | default({})).allow_groups | default([]) }}"
      close_bootstrap_port_after_success: "{{ vr.close_bootstrap_port_after_success | default(true) }}"
    vps_docker_enabled: "{{ (features | default({})).docker | default(true) | bool }}"
    vps_docker_add_managed_user: "{{ (docker | default({})).add_managed_user | default(true) | bool }}"
    vps_docker_debian_repo_url: >-
      {{
        (docker | default({})).debian_repo_url
        | default('https://download.docker.com/linux/' ~ (ansible_facts.distribution | lower))
      }}
    vps_docker_debian_gpg_url: >-
      {{
        (docker | default({})).debian_gpg_url
        | default(vps_docker_debian_repo_url ~ '/gpg')
      }}
    vps_docker_rhel_repo_url: >-
      {{
        (docker | default({})).rhel_repo_url
        | default('https://download.docker.com/linux/centos/docker-ce.repo')
      }}
    vps_docker_daemon_options: "{{ (docker | default({})).daemon_options | default({}) }}"
    vps_managed_groups: >-
      {{
        (
          (vps_managed.groups | default([]))
          + (['docker'] if (vps_docker_enabled | bool and vps_docker_add_managed_user | bool) else [])
        ) | unique
      }}
    vps_profile:
      base_packages: "{{ (features | default({})).base_packages | default(true) }}"
      unattended_upgrades: "{{ (features | default({})).unattended_upgrades | default(true) }}"
      system_limits: "{{ (features | default({})).system_limits | default(true) }}"
      ufw: "{{ (security | default({})).ufw_enabled | default((features | default({})).ufw | default(true)) }}"
    vps_firewall: >-
      {{ firewall | default({'default_incoming': 'deny',
                             'default_outgoing': 'allow',
                             'allowed_tcp_ports': [],
                             'allow_http_https': false}) }}
    vps_fail2ban: >-
      {{ (fail2ban | default({})) | combine({
           'enabled': (security | default({})).fail2ban_enabled
                      | default((features | default({})).fail2ban | default(false))
         }) }}
    vps_network_tuning: >-
      {{ (network_tuning | default({})) | combine({
           'enabled': (features | default({})).network_tuning | default(false)
         }) }}
    vps_swap: >-
      {{ (swap | default({})) | combine({
           'enabled': (features | default({})).swap | default(false)
         }) }}
    vps_package_install_list: "{{ (packages | default({})).install | default([]) }}"
    vps_base_packages_enabled: "{{ vps_profile.base_packages | default(true) | bool }}"

  pre_tasks:
    - name: First-time bootstrap - select password/bootstrap channel
      ansible.builtin.set_fact:
        ansible_user: "{{ vps_first_time_user }}"
        ansible_port: "{{ vps_first_time_port | int }}"
      become: false
      when:
        - vps_first_time | default(false) | bool
        - vps_first_time_key is not defined

    - name: First-time bootstrap - select key/bootstrap channel
      ansible.builtin.set_fact:
        ansible_user: "{{ vps_first_time_user }}"
        ansible_port: "{{ vps_first_time_port | int }}"
        ansible_ssh_private_key_file: "{{ vps_first_time_key }}"
      become: false
      when:
        - vps_first_time | default(false) | bool
        - vps_first_time_key is defined

    - name: Gather minimal facts after connection selection
      ansible.builtin.setup:
        gather_subset:
          - min
      check_mode: false

    - name: Assert managed SSH port policy
      ansible.builtin.assert:
        that:
          - vps_ssh.managed_port | int != 22
          - vps_ssh.managed_port | int >= 1024
          - vps_ssh.managed_port | int <= 65535
        fail_msg: "ssh.managed_port must be a non-22 high port."

    - name: Collect service facts
      ansible.builtin.service_facts:
      check_mode: false

    - name: Resolve SSH service name
      ansible.builtin.set_fact:
        vps_ssh_service_name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"

    - name: Initialize SSH socket activation facts
      ansible.builtin.set_fact:
        vps_ssh_socket_unit_name: ""
        vps_ssh_socket_activation_enabled: false

    - name: Probe active SSH socket activation units
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - "{{ item }}"
      loop:
        - ssh.socket
        - sshd.socket
      register: vps_ssh_socket_active_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts.service_mgr == 'systemd'

    - name: Resolve active SSH socket activation unit
      ansible.builtin.set_fact:
        vps_ssh_socket_unit_name: "{{ vps_ssh_socket_active_units[0] if (vps_ssh_socket_active_units | length) > 0 else '' }}"
        vps_ssh_socket_activation_enabled: "{{ (vps_ssh_socket_active_units | length) > 0 }}"
      vars:
        vps_ssh_socket_active_units: >-
          {{
            vps_ssh_socket_active_probe.results | default([])
            | selectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | list
          }}
      when: ansible_facts.service_mgr == 'systemd'

  tasks:
    # ── RHEL dnf hygiene — MUST precede every dnf operation below ───────────────
    # EPEL (needed only for fail2ban) pulls Fedora-mirror metadata that is slow or
    # unreachable from some regions. Left enabled, it makes EVERY later dnf op
    # (base packages, Docker) hang refreshing its metadata. So: bound dnf's network
    # waits, and neutralize an EPEL left enabled by a prior partial run. These are
    # pure config-file edits (no dnf), so they cannot themselves hang. EPEL is then
    # re-introduced disabled-by-default and enabled on-demand only for fail2ban.
    - name: Harden dnf network behavior (RedHat family)
      community.general.ini_file:
        path: /etc/dnf/dnf.conf
        section: main
        option: "{{ item.k }}"
        value: "{{ item.v }}"
        no_extra_spaces: true
        mode: "0644"
      loop:
        - { k: timeout, v: "15" }
        - { k: retries, v: "2" }
      when: ansible_facts.os_family == 'RedHat'

    - name: Check for an existing EPEL repo file (RedHat family)
      ansible.builtin.stat:
        path: /etc/yum.repos.d/epel.repo
      register: vps_epel_repo_file
      when: ansible_facts.os_family == 'RedHat'

    - name: Neutralize a pre-existing EPEL repo so it never blocks other dnf ops
      community.general.ini_file:
        path: /etc/yum.repos.d/epel.repo
        section: epel
        option: "{{ item.k }}"
        value: "{{ item.v }}"
        no_extra_spaces: true
        mode: "0644"
      loop:
        - { k: enabled, v: "0" }
        - { k: skip_if_unavailable, v: "1" }
      when:
        - ansible_facts.os_family == 'RedHat'
        - vps_epel_repo_file.stat.exists | default(false)

    - name: Install requested base packages
      ansible.builtin.package:
        name: "{{ vps_package_install_list }}"
        state: present
      when:
        - vps_base_packages_enabled
        - vps_package_install_list | length > 0

    - name: Remove explicitly unwanted packages
      ansible.builtin.package:
        name: "{{ (packages | default({})).remove | default([]) }}"
        state: absent
      when: ((packages | default({})).remove | default([])) | length > 0

    - name: Install Docker on Debian family
      when:
        - vps_docker_enabled | bool
        - ansible_facts.os_family == 'Debian'
      block:
        - name: Install Docker prerequisites
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
            state: present
            update_cache: true

        - name: Ensure Docker apt keyring directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Add Docker apt key
          ansible.builtin.get_url:
            url: "{{ vps_docker_debian_gpg_url }}"
            dest: /etc/apt/keyrings/docker.asc
            owner: root
            group: root
            mode: "0644"

        - name: Add Docker apt repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}
              signed-by=/etc/apt/keyrings/docker.asc]
              {{ vps_docker_debian_repo_url }}
              {{ ansible_facts.distribution_release }}
              stable
            state: present
            filename: docker
            update_cache: true

        - name: Install Docker Engine and Compose plugin
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

        - name: Ensure Docker service is running and enabled
          ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true

    - name: Install Docker on RedHat family
      when:
        - vps_docker_enabled | bool
        - ansible_facts.os_family == 'RedHat'
      block:
        - name: Install Docker repository tooling
          ansible.builtin.dnf:
            name: dnf-plugins-core
            state: present

        - name: Add Docker CE repository
          ansible.builtin.command:
            cmd: "dnf config-manager --add-repo {{ vps_docker_rhel_repo_url }}"
            creates: /etc/yum.repos.d/docker-ce.repo

        - name: Install Docker Engine and Compose plugin
          ansible.builtin.dnf:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

        - name: Detect SELinux mode for Docker cgroup policy
          ansible.builtin.command: getenforce
          register: vps_docker_rhel_selinux_mode
          changed_when: false
          check_mode: false

        - name: Install SELinux bindings for Docker cgroup policy
          ansible.builtin.dnf:
            name:
              - python3-libselinux
              - python3-libsemanage
            state: present
          when: vps_docker_rhel_selinux_mode.stdout in ['Enforcing', 'Permissive']

        - name: Allow Docker to manage cgroup under SELinux
          ansible.posix.seboolean:
            name: container_manage_cgroup
            state: true
            persistent: true
          vars:
            ansible_python_interpreter: /usr/bin/python3
          when: vps_docker_rhel_selinux_mode.stdout in ['Enforcing', 'Permissive']

        - name: Ensure Docker service is running and enabled
          ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true

    - name: Ensure Docker daemon config directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - vps_docker_enabled | bool
        - (vps_docker_daemon_options | length) > 0

    - name: Configure Docker daemon options
      ansible.builtin.copy:
        content: "{{ vps_docker_daemon_options | to_nice_json }}"
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      notify: Restart Docker
      when:
        - vps_docker_enabled | bool
        - (vps_docker_daemon_options | length) > 0

    - name: Flush handlers - apply Docker daemon config now
      ansible.builtin.meta: flush_handlers
      when:
        - vps_docker_enabled | bool
        - (vps_docker_daemon_options | length) > 0

    - name: Ensure managed groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: "{{ vps_managed_groups }}"

    - name: Ensure managed user exists
      ansible.builtin.user:
        name: "{{ vps_managed.user }}"
        groups: "{{ vps_managed_groups }}"
        append: true
        shell: "{{ vps_managed.shell | default('/bin/bash') }}"
        create_home: true
        state: present

    - name: Install managed user authorized keys
      ansible.posix.authorized_key:
        user: "{{ vps_managed.user }}"
        key: |
          {% for key_item in vps_managed.authorized_keys -%}
          {{ lookup('ansible.builtin.file', key_item.public_key) }}
          {% endfor %}
        state: present
        exclusive: false
      no_log: true

    - name: Configure managed sudo policy
      ansible.builtin.template:
        src: sudoers_ansispire.j2
        dest: "/etc/sudoers.d/99-ansispire-{{ vps_managed.user }}"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
      vars:
        vps_sudo_nopasswd: "{{ vps_managed.sudo.nopasswd | default(true) | bool }}"

    - name: Configure system limits
      ansible.builtin.copy:
        content: |
          # Managed by Ansispire vps_runner
          * soft nofile 65536
          * hard nofile 65536
          root soft nofile 65536
          root hard nofile 65536
        dest: /etc/security/limits.d/99-ansispire.conf
        owner: root
        group: root
        mode: "0644"
      when: vps_profile.system_limits | default(true) | bool

    - name: Install unattended upgrades package
      ansible.builtin.package:
        name: unattended-upgrades
        state: present
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.unattended_upgrades | default(true) | bool
        - not (vps_base_packages_enabled and 'unattended-upgrades' in vps_package_install_list)

    - name: Configure optional swapfile
      when:
        - vps_swap.enabled | default(false) | bool
        - not ansible_check_mode
      block:
        - name: Check swapfile state
          ansible.builtin.stat:
            path: /swapfile
          register: vps_swapfile_stat

        - name: Allocate swapfile
          ansible.builtin.command:
            argv:
              - fallocate
              - -l
              - "{{ vps_swap.size_gb | default(1) }}G"
              - /swapfile
          when: not vps_swapfile_stat.stat.exists
          changed_when: true

        - name: Set swapfile permissions
          ansible.builtin.file:
            path: /swapfile
            owner: root
            group: root
            mode: "0600"

        - name: Format swapfile
          ansible.builtin.command:
            argv:
              - mkswap
              - /swapfile
          when: not vps_swapfile_stat.stat.exists
          changed_when: true

        - name: Ensure swapfile is mounted
          ansible.posix.mount:
            path: none
            src: /swapfile
            fstype: swap
            opts: sw
            state: present

        - name: Enable swapfile now
          ansible.builtin.command:
            argv:
              - swapon
              - /swapfile
          register: vps_swapon_result
          failed_when: vps_swapon_result.rc not in [0, 255]
          changed_when: vps_swapon_result.rc == 0

    - name: Apply optional BBR tuning
      ansible.posix.sysctl:
        name: net.ipv4.tcp_congestion_control
        value: bbr
        sysctl_set: true
        state: present
        reload: true
      when:
        - vps_network_tuning.enabled | default(false) | bool
        - vps_network_tuning.bbr | default(false) | bool

    - name: Apply optional TCP Fast Open tuning
      ansible.posix.sysctl:
        name: net.ipv4.tcp_fastopen
        value: "3"
        sysctl_set: true
        state: present
        reload: true
      when:
        - vps_network_tuning.enabled | default(false) | bool
        - vps_network_tuning.tcp_fastopen | default(false) | bool

    - name: Apply optional MTU probing tuning
      ansible.posix.sysctl:
        name: net.ipv4.tcp_mtu_probing
        value: "1"
        sysctl_set: true
        state: present
        reload: true
      when:
        - vps_network_tuning.enabled | default(false) | bool
        - vps_network_tuning.mtu_probing | default(false) | bool

    - name: Install fail2ban (EPEL on RedHat) — fail-soft on repo outage
      # fail2ban is optional hardening. Its package source can be flaky (EPEL on
      # RHEL pulls Fedora-mirror metadata, which times out from some regions/hosts).
      # EPEL is installed but kept DISABLED by default (it poisons every dnf op when
      # enabled+unreachable) and enabled on-demand only for this install. Retry; if
      # it still fails, defer fail2ban (set a flag, warn) instead of aborting the
      # whole onboard — re-add later via `modify --toggle-fail2ban on`.
      when: vps_fail2ban.enabled | default(false) | bool
      block:
        - name: Install EPEL repo definition (RedHat family)
          # fail2ban lives in EPEL, not RHEL/AlmaLinux/Rocky base repos. epel-release
          # ships in the default-enabled `extras` repo, so this is self-contained.
          ansible.builtin.dnf:
            name: epel-release
            state: present
          register: vps_epel_install
          until: vps_epel_install is succeeded
          retries: 3
          delay: 10
          when: ansible_facts.os_family == 'RedHat'

        - name: Keep EPEL disabled by default + non-blocking (RedHat family)
          community.general.ini_file:
            path: /etc/yum.repos.d/epel.repo
            section: epel
            option: "{{ item.k }}"
            value: "{{ item.v }}"
            no_extra_spaces: true
            mode: "0644"
          loop:
            - { k: enabled, v: "0" }
            - { k: skip_if_unavailable, v: "1" }
          when: ansible_facts.os_family == 'RedHat'

        - name: Probe EPEL reachability with a hard wall-clock cap (RedHat family)
          # `enablerepo: epel` makes dnf fetch EPEL metadata via a metalink that can
          # fan out to dozens of mirrors — dnf's per-connection timeout/retries do
          # NOT bound the total, so an unreachable EPEL hangs for minutes. `timeout`
          # kills the dnf process at 30s (SIGKILL +5s), and `makecache` caches the
          # metadata so the install below uses cache (no re-download). rc 0 = EPEL
          # usable; anything else (124 = timed out) = defer fail2ban.
          ansible.builtin.command:
            cmd: timeout -k 5 30 dnf -q --enablerepo=epel makecache --refresh
          register: vps_epel_probe
          changed_when: false
          failed_when: false
          check_mode: false
          when: ansible_facts.os_family == 'RedHat'

        - name: Defer fail2ban — EPEL unreachable within cap (RedHat family)
          ansible.builtin.set_fact:
            vps_fail2ban_deferred: true
          when:
            - ansible_facts.os_family == 'RedHat'
            - vps_epel_probe.rc | default(1) != 0

        - name: Warn that fail2ban was deferred (EPEL unreachable)
          ansible.builtin.debug:
            msg: >-
              [WARNING] EPEL unreachable from this host within the probe cap — fail2ban
              deferred. Core onboarding continues WITHOUT fail2ban; re-add it later with
              `python -m plugins.vps_runner.cli modify {{ inventory_hostname }}
              --env <env> --toggle-fail2ban on` once EPEL is reachable.
          when:
            - ansible_facts.os_family == 'RedHat'
            - vps_epel_probe.rc | default(1) != 0

        - name: Install fail2ban from EPEL on-demand (RedHat family)
          ansible.builtin.dnf:
            name: >-
              {{
                ['fail2ban']
                + (['python3-systemd']
                   if ansible_facts.service_mgr == 'systemd'
                   else [])
              }}
            state: present
            enablerepo: epel
          when:
            - ansible_facts.os_family == 'RedHat'
            - vps_epel_probe.rc | default(1) == 0

        - name: Install fail2ban support packages (Debian family)
          ansible.builtin.package:
            name: >-
              {{
                ['fail2ban']
                + (['python3-systemd']
                   if ansible_facts.service_mgr == 'systemd'
                   else [])
              }}
            state: present
          when: ansible_facts.os_family == 'Debian'
      rescue:
        - name: Defer fail2ban after repo/package failure (fail-soft)
          ansible.builtin.set_fact:
            vps_fail2ban_deferred: true

        - name: Warn that fail2ban was deferred
          ansible.builtin.debug:
            msg: >-
              [WARNING] fail2ban install failed (likely EPEL/repo metadata
              unreachable from this host). Core onboarding continues WITHOUT
              fail2ban; re-add it later with
              `python -m plugins.vps_runner.cli modify {{ inventory_hostname }}
              --env <env> --toggle-fail2ban on` once the repo is reachable.

    - name: Configure fail2ban sshd jail
      ansible.builtin.template:
        src: fail2ban_sshd.local.j2
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
      when:
        - vps_fail2ban.enabled | default(false) | bool
        - not (vps_fail2ban_deferred | default(false) | bool)
      notify: Restart fail2ban

    - name: Flush handlers - apply fail2ban config now
      ansible.builtin.meta: flush_handlers
      when:
        - vps_fail2ban.enabled | default(false) | bool
        - not (vps_fail2ban_deferred | default(false) | bool)

    - name: Ensure fail2ban is enabled and active
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started
      register: vps_fail2ban_service_status
      until: vps_fail2ban_service_status.status.ActiveState == 'active'
      retries: 6
      delay: 5
      when:
        - vps_fail2ban.enabled | default(false) | bool
        - not (vps_fail2ban_deferred | default(false) | bool)
        - not ansible_check_mode

    - name: Verify fail2ban sshd jail is loaded
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - sshd
      register: vps_fail2ban_jail_status
      changed_when: false
      until: vps_fail2ban_jail_status.rc == 0
      retries: 6
      delay: 5
      when:
        - vps_fail2ban.enabled | default(false) | bool
        - not (vps_fail2ban_deferred | default(false) | bool)
        - not ansible_check_mode

    - name: Install UFW on Debian family
      ansible.builtin.package:
        name: ufw
        state: present
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.ufw | default(true) | bool
        - not (vps_base_packages_enabled and 'ufw' in vps_package_install_list)

    - name: Allow managed SSH port before enabling UFW
      community.general.ufw:
        rule: allow
        port: "{{ vps_ssh.managed_port | string }}"
        proto: tcp
        comment: Ansispire SSH
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.ufw | default(true) | bool

    - name: Keep bootstrap SSH port open until final validation
      community.general.ufw:
        rule: allow
        port: "{{ vps_bootstrap.port | string }}"
        proto: tcp
        comment: Ansispire bootstrap SSH
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.ufw | default(true) | bool
        - vps_bootstrap.port | int != vps_ssh.managed_port | int

    - name: Allow requested additional TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
        proto: tcp
      loop: "{{ vps_firewall.allowed_tcp_ports | default([]) }}"
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.ufw | default(true) | bool
        - item | int != vps_ssh.managed_port | int
        - item | int != vps_bootstrap.port | int

    - name: Allow HTTP and HTTPS when explicitly requested
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.ufw | default(true) | bool
        - vps_firewall.allow_http_https | default(false) | bool

    - name: Set UFW incoming default
      community.general.ufw:
        default: "{{ vps_firewall.default_incoming | default('deny') }}"
        direction: incoming
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.ufw | default(true) | bool

    - name: Set UFW outgoing default
      community.general.ufw:
        default: "{{ vps_firewall.default_outgoing | default('allow') }}"
        direction: outgoing
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.ufw | default(true) | bool

    - name: Enable UFW
      community.general.ufw:
        state: enabled
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.ufw | default(true) | bool

    # ── RHEL firewall: firewalld (mirror of the UFW block above) ────────────────
    # Only manage firewalld when it is the host's ACTIVE firewall. If it is
    # absent/stopped the host relies on nftables / a cloud security group, and
    # enabling it here could silently drop traffic — so we skip. service_facts
    # was gathered in pre_tasks. firewalld is deny-incoming-by-default in its
    # default zone, so (unlike UFW) no explicit default-policy task is needed.
    - name: Detect active firewalld (RedHat family)
      ansible.builtin.set_fact:
        vps_firewalld_active: >-
          {{
            ansible_facts.os_family == 'RedHat'
            and (ansible_facts.services | default({})).get('firewalld.service', {}).get('state', '') == 'running'
          }}

    - name: Configure firewalld rules (RedHat family)
      when: vps_firewalld_active | bool
      block:
        - name: Ensure firewalld is enabled at boot
          ansible.builtin.systemd:
            name: firewalld
            enabled: true

        - name: Allow managed SSH port (firewalld)
          ansible.posix.firewalld:
            port: "{{ vps_ssh.managed_port }}/tcp"
            permanent: true
            immediate: true
            state: enabled

        - name: Keep bootstrap SSH port open until final validation (firewalld)
          ansible.posix.firewalld:
            port: "{{ vps_bootstrap.port }}/tcp"
            permanent: true
            immediate: true
            state: enabled
          when: vps_bootstrap.port | int != vps_ssh.managed_port | int

        - name: Allow requested additional TCP ports (firewalld)
          ansible.posix.firewalld:
            port: "{{ item }}/tcp"
            permanent: true
            immediate: true
            state: enabled
          loop: "{{ vps_firewall.allowed_tcp_ports | default([]) }}"
          when:
            - item | int != vps_ssh.managed_port | int
            - item | int != vps_bootstrap.port | int

        - name: Allow HTTP and HTTPS when explicitly requested (firewalld)
          ansible.posix.firewalld:
            service: "{{ item }}"
            permanent: true
            immediate: true
            state: enabled
          loop:
            - http
            - https
          when: vps_firewall.allow_http_https | default(false) | bool

    - name: Ensure sshd drop-in directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Comment direct Ansispire-managed lines in main sshd_config
      # Sentinel `ANSISPIRE-COMMENTED:` is the marker remove.yml reverses to
      # restore distro-default state when --cleanup-remote is passed.
      ansible.builtin.replace:
        path: /etc/ssh/sshd_config
        regexp: "{{ vps_sshd_directive_regexp }}"
        replace: '# ANSISPIRE-COMMENTED: \1'
        backup: true
      vars:
        vps_sshd_directives:
          - Port
          - PubkeyAuthentication
          - X11Forwarding
          - ClientAliveInterval
          - ClientAliveCountMax
          - LoginGraceTime
          - PermitRootLogin
          - PasswordAuthentication
          - KbdInteractiveAuthentication
          - ChallengeResponseAuthentication
          - AllowGroups
        vps_sshd_directive_regexp: "^\\s*({{ vps_sshd_directives | join('|') }}\\s+.*)$"
      notify: Reload sshd

    # ── SELinux: allow sshd to bind the non-22 managed port ─────────────────────
    # Under SELinux enforcing, sshd may only bind ports labeled `ssh_port_t`
    # (22 by default). Without this, the reload below leaves sshd unable to
    # listen on the managed port and 'Wait for managed SSH port' times out. Label
    # it before the reload. Harmless when permissive; skipped when disabled.
    - name: Detect SELinux mode for managed SSH port (RedHat family)
      ansible.builtin.command: getenforce
      register: vps_rhel_selinux_mode
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts.os_family == 'RedHat'

    - name: Install SELinux management bindings for seport (RedHat family)
      ansible.builtin.dnf:
        name: policycoreutils-python-utils
        state: present
      when:
        - ansible_facts.os_family == 'RedHat'
        - vps_rhel_selinux_mode.stdout | default('') in ['Enforcing', 'Permissive']

    - name: Label managed SSH port for SELinux (ssh_port_t)
      community.general.seport:
        ports: "{{ vps_ssh.managed_port | string }}"
        proto: tcp
        setype: ssh_port_t
        state: present
      vars:
        ansible_python_interpreter: /usr/bin/python3
      when:
        - ansible_facts.os_family == 'RedHat'
        - vps_rhel_selinux_mode.stdout | default('') in ['Enforcing', 'Permissive']

    - name: Install transitional sshd drop-in with managed port
      ansible.builtin.template:
        src: sshd_ansispire.conf.j2
        dest: /etc/ssh/sshd_config.d/00-ansispire.conf
        owner: root
        group: root
        mode: "0644"
      vars:
        vps_ssh_lockdown_enabled: false
      notify: Reload sshd

    - name: Remove legacy late sshd drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-ansispire.conf
        state: absent
      notify: Reload sshd

    - name: Ensure SSH socket drop-in directory exists
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ vps_ssh_socket_unit_name }}.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: vps_ssh_socket_activation_enabled | bool

    - name: Install transitional SSH socket override
      ansible.builtin.template:
        src: ssh_socket_ansispire.conf.j2
        dest: "/etc/systemd/system/{{ vps_ssh_socket_unit_name }}.d/99-ansispire.conf"
        owner: root
        group: root
        mode: "0644"
      vars:
        vps_ssh_lockdown_enabled: false
      when: vps_ssh_socket_activation_enabled | bool
      notify:
        - Reload systemd manager
        - Restart sshd.socket

    - name: Validate sshd configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false
      check_mode: false

    # Flush handlers here so any failure above blocks sshd reload (we must NOT
    # reload sshd with broken config). The `restart sshd.socket` handler is
    # guarded by check-mode/socket-activation conditions inside the handler.
    - name: Flush handlers — apply transitional SSH config now
      ansible.builtin.meta: flush_handlers

    - name: Wait for managed SSH port to answer
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ vps_ssh.managed_port | int }}"
        timeout: 30
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    - name: Switch Ansible connection to managed channel
      ansible.builtin.set_fact:
        ansible_user: "{{ vps_managed.user }}"
        ansible_port: "{{ vps_ssh.managed_port | int }}"
        ansible_ssh_private_key_file: "{{ vps_managed.ansible_key.private_key }}"
      become: false
      when: not ansible_check_mode

    # Reset the persistent control connection so Ansible re-dials using the
    # managed user + new port + managed key, then prove managed login + sudo.
    - name: Reset connection after managed channel switch
      ansible.builtin.meta: reset_connection

    - name: Wait for managed-user connection
      ansible.builtin.wait_for_connection:
        timeout: 30
      when: not ansible_check_mode

    - name: Validate managed user sudo (native)
      ansible.builtin.command: id -u
      become: true
      changed_when: false
      when: not ansible_check_mode

    - name: Install final locked-down sshd drop-in
      ansible.builtin.template:
        src: sshd_ansispire.conf.j2
        dest: /etc/ssh/sshd_config.d/00-ansispire.conf
        owner: root
        group: root
        mode: "0644"
      vars:
        vps_ssh_lockdown_enabled: true
      notify: Reload sshd

    - name: Install final locked-down SSH socket override
      ansible.builtin.template:
        src: ssh_socket_ansispire.conf.j2
        dest: "/etc/systemd/system/{{ vps_ssh_socket_unit_name }}.d/99-ansispire.conf"
        owner: root
        group: root
        mode: "0644"
      vars:
        vps_ssh_lockdown_enabled: true
      when: vps_ssh_socket_activation_enabled | bool
      notify:
        - Reload systemd manager
        - Restart sshd.socket

    - name: Validate final sshd configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false
      check_mode: false

    - name: Flush handlers — apply lockdown SSH config now
      ansible.builtin.meta: flush_handlers

    - name: Close bootstrap SSH port after final validation
      community.general.ufw:
        rule: allow
        port: "{{ vps_bootstrap.port | string }}"
        proto: tcp
        delete: true
      when:
        - ansible_facts.os_family == 'Debian'
        - vps_profile.ufw | default(true) | bool
        - vps_ssh.close_bootstrap_port_after_success | default(true) | bool
        - vps_bootstrap.port | int != vps_ssh.managed_port | int
        - not ansible_check_mode

    - name: Close bootstrap SSH port after final validation (firewalld)
      ansible.posix.firewalld:
        port: "{{ vps_bootstrap.port }}/tcp"
        permanent: true
        immediate: true
        state: disabled
      when:
        - vps_firewalld_active | default(false) | bool
        - vps_ssh.close_bootstrap_port_after_success | default(true) | bool
        - vps_bootstrap.port | int != vps_ssh.managed_port | int
        - not ansible_check_mode

    - name: Reset Ansible connection after final lockdown
      ansible.builtin.meta: reset_connection

    - name: Wait for managed-user connection after lockdown
      ansible.builtin.wait_for_connection:
        timeout: 30
      when: not ansible_check_mode

    - name: Validate final managed login (native)
      ansible.builtin.command: "true"
      changed_when: false
      when: not ansible_check_mode

  handlers:
    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: restarted
      when: not ansible_check_mode

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
        enabled: true
      when: not ansible_check_mode

    - name: Reload sshd
      ansible.builtin.systemd:
        name: "{{ vps_ssh_service_name }}"
        state: reloaded
      when: not ansible_check_mode

    - name: Reload systemd manager
      ansible.builtin.systemd:
        daemon_reload: true
      when: not ansible_check_mode

    - name: Restart sshd.socket
      ansible.builtin.systemd:
        name: "{{ vps_ssh_socket_unit_name }}"
        state: restarted
      when:
        - not ansible_check_mode
        - vps_ssh_socket_activation_enabled | bool
