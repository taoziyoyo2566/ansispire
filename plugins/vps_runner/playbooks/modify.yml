---
# vps_runner modify playbook.
#
# Driven by the `vps_changes` extravar passed in by the CLI. Schema:
#   vps_changes:
#     packages:
#       install: [pkg1, pkg2]
#       remove:  [pkg3]
#     firewall:
#       allowed_tcp_ports:
#         add:    [8080, 9090]
#         remove: [9000]
#     fail2ban:
#       enabled: true|false   # toggle
#     network_tuning:
#       enabled: true
#       bbr: true
#       tcp_fastopen: false
#       mtu_probing: false
#
# All sections are optional; only requested changes execute.

- name: Modify an onboarded VPS (vps_runner)
  hosts: vps_targets
  become: true
  gather_facts: true
  vars:
    vps_changes: "{{ vps_changes | default({}) }}"
    vps_package_changes: "{{ vps_changes.get('packages', {}) }}"
    vps_firewall_changes: "{{ vps_changes.get('firewall', {}) }}"
    vps_fail2ban_changes: "{{ vps_changes.get('fail2ban', {}) }}"
    vps_network_tuning_changes: "{{ vps_changes.get('network_tuning', {}) }}"

  tasks:
    - name: Install requested packages
      ansible.builtin.package:
        name: "{{ vps_package_changes.install | default([]) }}"
        state: present
      when: (vps_package_changes.install | default([])) | length > 0

    - name: Remove requested packages
      ansible.builtin.package:
        name: "{{ vps_package_changes.remove | default([]) }}"
        state: absent
      when: (vps_package_changes.remove | default([])) | length > 0

    - name: Apply requested UFW TCP allows
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
        proto: tcp
      loop: >-
        {{ (vps_firewall_changes.get('allowed_tcp_ports', {})
            ).get('add', []) }}
      when:
        - ansible_facts.os_family == 'Debian'
        - (vps_firewall_changes.get('allowed_tcp_ports', {}).get('add', []))
          | length > 0

    - name: Remove requested UFW TCP allows
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
        proto: tcp
        delete: true
      loop: >-
        {{ (vps_firewall_changes.get('allowed_tcp_ports', {})
            ).get('remove', []) }}
      when:
        - ansible_facts.os_family == 'Debian'
        - (vps_firewall_changes.get('allowed_tcp_ports', {}).get('remove', []))
          | length > 0

    - name: Apply optional BBR tuning
      ansible.posix.sysctl:
        name: net.ipv4.tcp_congestion_control
        value: bbr
        sysctl_set: true
        state: present
        reload: true
      when:
        - vps_network_tuning_changes.enabled | default(false) | bool
        - vps_network_tuning_changes.bbr | default(false) | bool

    - name: Apply optional TCP Fast Open tuning
      ansible.posix.sysctl:
        name: net.ipv4.tcp_fastopen
        value: "3"
        sysctl_set: true
        state: present
        reload: true
      when:
        - vps_network_tuning_changes.enabled | default(false) | bool
        - vps_network_tuning_changes.tcp_fastopen | default(false) | bool

    - name: Apply optional MTU probing tuning
      ansible.posix.sysctl:
        name: net.ipv4.tcp_mtu_probing
        value: "1"
        sysctl_set: true
        state: present
        reload: true
      when:
        - vps_network_tuning_changes.enabled | default(false) | bool
        - vps_network_tuning_changes.mtu_probing | default(false) | bool

    - name: Install fail2ban when toggled on
      ansible.builtin.package:
        name: fail2ban
        state: present
      when: vps_fail2ban_changes.enabled | default(false) | bool

    - name: Configure fail2ban sshd jail
      ansible.builtin.template:
        src: fail2ban_sshd.local.j2
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
      vars:
        vps_ssh:
          managed_port: "{{ ansible_port }}"
        vps_fail2ban: "{{ vps_fail2ban_changes }}"
      when: vps_fail2ban_changes.enabled | default(false) | bool

    - name: Ensure fail2ban is enabled after modification
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started
      when:
        - vps_fail2ban_changes.enabled | default(false) | bool
        - not ansible_check_mode

    - name: Stop fail2ban when toggled off
      ansible.builtin.systemd:
        name: fail2ban
        enabled: false
        state: stopped
      when:
        - vps_fail2ban_changes.enabled is defined
        - not (vps_fail2ban_changes.enabled | bool)
        - not ansible_check_mode
      failed_when: false
