e="stroke:#181818;stroke-width:0.5;" width="265.0742" x="21" y="504.7842"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.8633" x="34.1055" y="525.9229">trigger remediation template (Task API)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="22.6289" x="31" y="539.8916">e.g.</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="218.6309" x="57.4434" y="539.8916">Auto Remediation: Disk Cleanup</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.8379" x="32.1182" y="572.7217"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.8379" x="42.1182" y="593.8604">run disk_cleanup.yml &#8594; emits events</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.248" x="64.4131" y="607.8291">(loop is auditable end-to-end)</text><ellipse cx="153.5371" cy="651.6592" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="153.5371" cy="651.6592" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="678.6592"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="218.9199" x="734.0703" y="169.9639"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.9199" x="744.0703" y="191.1025">cursor-paginated pull /api/events</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.918" x="761.0713" y="205.0713">(resumable, heartbeat 60s)</text><line style="stroke:#000000;stroke-width:1.5;" x1="728.0703" x2="728.0703" y1="50.042" y2="678.6592"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry=