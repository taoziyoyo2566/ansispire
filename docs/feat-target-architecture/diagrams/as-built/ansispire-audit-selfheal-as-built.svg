ze="13" lengthAdjust="spacing" textLength="4.1323" x="589.8071" y="412.2729">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.8779" x="510.9343" y="427.4058">Excluded from AS-BUILT:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.6406" x="434.553" y="442.5386">- "DB Connection Failure" rule &#8212; enabled=false,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.5073" x="453.8181" y="457.6714">db_failover.yml is a placeholder (TASK-008).</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="265.0742" x="21" y="565.3154"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.8633" x="34.1055" y="586.4541">trigger remediation template (Task API)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="22.6289" x="31" y="600.4229">e.g.</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="218.6309" x="57.4434" y="600.4229">Auto Remediation: Disk Cleanup</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="223.8301" x="41.6221" y="633.2529"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.5898" x="87.7422" y="654.3916">run disk_cleanup.yml;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.8301" x="51.6221" y="668.3604">remediation task reaches success</text><ellipse cx="153.5371" cy="712.1904" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="153.5371" cy="712.1904" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="739.1904"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="218.9199" x="816.3169" y="169.9639"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.9199" x="826.3169" y="191.1025">cursor-paginated pull /api/events</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.918" x="843.3179" y="205.0713">(resumable, heartbeat 60s)</text><line style="stroke:#000000;stroke-width:1.5;" x1="810.3169" x2="810.3169" y1="50.042" y2="739.1904"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="340.8125" x="1045.2368" y="237.9014"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.8535" x="1111.1909" y="259.04">receive &#8594; append to</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="82.2363" x="1237.8589" y="259.04">events.jsonl</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="320.8125" x="1055.2368" y="273.0088">(application-level append writer; not tamper-evident)</text><line style="stroke:#000000;stroke-width:1.5;" x1="1039.2368" x2="1039.2368" y1="50.042" y2="739.1904"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="225.7168" x="1565.8618" y="305.8389"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="205.7168" x="1575.8618" y="326.9775">tail events.jsonl &#183; match rules.json</text><path d="M1779.3835,349.8076 L1779.3835,465.7373 L2197.2708,465.7373 L2197.2708,359.8076 L2187.2708,349.8076 L1779.3835,349.8076 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2187.2708,349.8076 L2187.2708,359.8076 L2197.2708,359.8076 L2187.2708,349.8076 " fill